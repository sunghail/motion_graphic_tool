<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PSA Bed 조립·충전</title>
<style>
:root{
  --bg:#eef1f5; --panel:#ffffff; --ink:#17202b; --muted:#5d6876; --line:#d8dee6;
  --accent:#2563eb; --accent-soft:#e8efff;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  display:flex;flex-direction:column;min-height:100vh;background:var(--bg);color:var(--ink);
  font-family:"Pretendard","Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
}
header{padding:14px 20px 10px;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
header h1{font-size:18px;margin:0;font-weight:700;letter-spacing:-.01em}
header p{margin:0;color:var(--muted);font-size:13px}
main{flex:1;display:flex;gap:14px;padding:0 20px;min-height:0}
.stage{flex:1;position:relative;background:#f8fafc;border:1px solid var(--line);border-radius:12px;overflow:hidden;min-height:440px}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.caption{
  position:absolute;top:14px;right:14px;width:min(360px,calc(100% - 28px));
  background:rgba(255,255,255,.93);border:1px solid var(--line);
  border-radius:10px;padding:12px 14px 12px;box-shadow:0 4px 18px rgba(20,30,50,.06);
}
.cap-step{font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--accent)}
.cap-title{font-size:17px;font-weight:700;margin:3px 0 4px}
.cap-desc{font-size:13px;line-height:1.55;color:#333d4a}
.cap-bar{height:3px;background:#e6eaf0;border-radius:2px;margin-top:10px;overflow:hidden}
.cap-bar i{display:block;height:100%;width:0;background:var(--accent)}
aside{width:250px;flex:none;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 8px;overflow:auto}
aside h2{font-size:11px;letter-spacing:.08em;color:var(--muted);margin:10px 10px 4px;font-weight:700}
aside ol{list-style:none;margin:0;padding:0}
aside li{display:flex;gap:10px;align-items:center;padding:7px 10px;border-radius:8px;cursor:pointer;font-size:13.5px;color:#2b3542}
aside li:hover{background:#f3f5f8}
aside li .n{width:22px;height:22px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;background:#eef1f5;color:var(--muted)}
aside li .tm{margin-left:auto;font-size:11px;color:#8a94a2;font-variant-numeric:tabular-nums}
aside li.done .n{background:#dbe4f3;color:#3b5b91}
aside li.on{background:var(--accent-soft);color:#10244d;font-weight:600}
aside li.on .n{background:var(--accent);color:#fff}
footer{display:flex;align-items:center;gap:12px;padding:12px 20px 16px;flex-wrap:wrap}
button,select{font:inherit;font-size:13px;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:8px;padding:7px 12px;cursor:pointer}
button:hover,select:hover{border-color:#b9c3d0}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;min-width:74px}
.track{flex:1;min-width:220px;position:relative;height:28px;display:flex;align-items:center}
.track input{width:100%;margin:0;accent-color:var(--accent);position:relative;z-index:1}
.ticks{position:absolute;left:8px;right:8px;top:0;bottom:0;pointer-events:none}
.ticks span{position:absolute;top:3px;width:1px;height:6px;background:#9aa6b5}
.time{font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted);min-width:92px;text-align:right}
label.chk{font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center;cursor:pointer}
.hint{font-size:12px;color:#8a94a2}
@media (max-width:900px){
  main{flex-direction:column}
  aside{width:auto;max-height:180px}
  .stage{min-height:62vh}
}
</style>
</head>
<body>
<header>
  <h1>PSA 흡착탑(Bed) 조립·충전</h1>
  <p>부품이 착착 끼워져 탑이 되고, 흡착제 구슬이 층층이 채워지는 과정 · 층 구성은 H₂ PSA 3층 충전을 예로 든 설명용 그림입니다</p>
</header>
<main>
  <div class="stage" id="stage">
    <canvas id="cv"></canvas>
    <div class="caption" id="caption">
      <div class="cap-step" id="capStep"></div>
      <div class="cap-title" id="capTitle"></div>
      <div class="cap-desc" id="capDesc"></div>
      <div class="cap-bar"><i id="capBar"></i></div>
    </div>
  </div>
  <aside id="chapters"></aside>
</main>
<footer>
  <button class="primary" id="btnPlay">일시정지</button>
  <button id="btnRestart">처음부터</button>
  <div class="track"><div class="ticks" id="ticks"></div><input type="range" id="scrub" min="0" max="52" step="0.01" value="0"></div>
  <span class="time" id="time">0.0 / 52.0 s</span>
  <select id="speed"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="1.5">1.5×</option><option value="2">2×</option></select>
  <label class="chk"><input type="checkbox" id="loop"> 반복</label>
  <span class="hint">Space 재생/정지 · ←/→ 3초 이동</span>
</footer>

<script>
'use strict';
// ============================================================
//  Flat 2D style. Vessel axis vertical, seen slightly from above:
//  an ellipse with ry = r*TILT is a horizontal circle.
//  Every frame is a pure function of t, so scrubbing is exact.
// ============================================================
const W = 1100, H = 860, T_END = 52;
const cx = 400, R = 120, TILT = 0.22, RY = R * TILT;
const yTop = 210, yBot = 630;          // tangent lines of the straight shell
const HD = 60;                          // 2:1 semi-ellipsoidal head depth = D/4
const WALL = 7, RI = R - WALL;
const RN = 22, RF = 38;                 // nozzle / flange radius
const FLOOR = 800, G = 1600;
const FUN = { yT: 12, rT: 100, yB: 92, rB: 13, yExit: 114 };   // loading hopper
const BAG_OUT = -36;                                            // bulk-bag spout

const INK = '#27313d', M_BODY = '#cfd8e2', M_SHADE = '#aab7c5', M_LIGHT = '#f6f9fb', M_TOP = '#e4eaf0', M_IN = '#5d6977';
const FONT = '"Pretendard","Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif';

// ---------------- helpers ----------------
const clamp = (v, a = 0, b = 1) => v < a ? a : v > b ? b : v;
const lerp = (a, b, u) => a + (b - a) * u;
const pr = (t, a, b) => clamp((t - a) / (b - a));
const eio = u => u < .5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2;
const eo = u => 1 - Math.pow(1 - u, 3);
const eob = u => { const c1 = 1.8, c3 = c1 + 1; return 1 + c3 * Math.pow(u - 1, 3) + c1 * Math.pow(u - 1, 2); };
const h1 = i => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
function mulberry(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let DPR = 1, VIEW = { s: 1, ox: 0, oy: 0 };
function resize() {
  const r = cv.getBoundingClientRect();
  DPR = window.devicePixelRatio || 1;
  cv.width = Math.max(1, Math.round(r.width * DPR));
  cv.height = Math.max(1, Math.round(r.height * DPR));
  const s = Math.min(r.width / W, r.height / H);
  VIEW = { s, ox: (r.width - W * s) / 2, oy: (r.height - H * s) / 2 };
}
new ResizeObserver(resize).observe(cv);
resize();

// ---------------- flat drawing primitives ----------------
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x, y, w, h, r) : ctx.rect(x, y, w, h); }
// flat metal: base colour, a shade band on the right, a light stripe on the left, ink outline
function metalFill(path, x, r, lw = 2) {
  path(); ctx.fillStyle = M_BODY; ctx.fill();
  ctx.save(); path(); ctx.clip();
  ctx.fillStyle = M_SHADE; ctx.fillRect(x + r * .42, -3000, r * .6 + 4, 6000);
  ctx.fillStyle = M_LIGHT; ctx.fillRect(x - r * .64, -3000, r * .17, 6000);
  ctx.globalAlpha = .7; ctx.fillRect(x - r * .38, -3000, r * .05, 6000);
  ctx.restore();
  path(); ctx.strokeStyle = INK; ctx.lineWidth = lw; ctx.lineJoin = 'round'; ctx.stroke();
}
function cylPath(x, y0, y1, r) {
  return () => { ctx.beginPath(); ctx.moveTo(x - r, y0); ctx.lineTo(x - r, y1); ctx.ellipse(x, y1, r, r * TILT, 0, Math.PI, 0, true); ctx.lineTo(x + r, y0); ctx.closePath(); };
}
function face(x, y, r, bore, bolts, solid) {
  ctx.beginPath(); ctx.ellipse(x, y, r, r * TILT, 0, 0, Math.PI * 2);
  ctx.fillStyle = M_TOP; ctx.fill(); ctx.strokeStyle = INK; ctx.lineWidth = 1.6; ctx.stroke();
  if (bore) { ctx.beginPath(); ctx.ellipse(x, y, bore, bore * TILT, 0, 0, Math.PI * 2); ctx.fillStyle = M_IN; ctx.fill(); ctx.stroke(); }
  if (bolts) for (let j = 0; j < 8; j++) {
    const a = j * Math.PI / 4 + Math.PI / 8, bx = x + (r - 6) * Math.cos(a), by = y + (r - 6) * TILT * Math.sin(a);
    ctx.beginPath(); ctx.ellipse(bx, by, solid ? 2.8 : 2, solid ? 1.7 : 1.1, 0, 0, 7);
    ctx.fillStyle = solid ? M_BODY : INK; ctx.fill();
    if (solid) { ctx.lineWidth = .9; ctx.stroke(); }
  }
}
function makeSprite(r, base, hiA) {
  const S = 5, d = Math.ceil((2 * r + 3) * S);
  const c = document.createElement('canvas'); c.width = c.height = d;
  const g = c.getContext('2d'), R0 = r * S, C = d / 2;
  g.beginPath(); g.arc(C, C, R0, 0, Math.PI * 2); g.fillStyle = base; g.fill();
  g.lineWidth = S * .85; g.strokeStyle = 'rgba(32,38,48,.9)'; g.stroke();
  g.beginPath(); g.arc(C - R0 * .36, C - R0 * .36, R0 * .28, 0, Math.PI * 2); g.fillStyle = `rgba(255,255,255,${hiA})`; g.fill();
  return { c, d: d / S, base };
}

// ---------------- part motion: fly in, then "snap" with squash ----------------
function snapT(t, t0, t1, dx, dy, amp = .1) {
  if (t < t0) return null;
  const vert = dy !== 0;
  if (t < t1) {
    const u = (t - t0) / (t1 - t0), e = 1 - u * u, st = 1 + .12 * u;
    return vert ? { dx: dx * e, dy: dy * e, sx: 1 / Math.sqrt(st), sy: st } : { dx: dx * e, dy: dy * e, sx: st, sy: 1 / Math.sqrt(st) };
  }
  const tau = t - t1, s = amp * Math.exp(-9 * tau) * Math.cos(24 * tau);
  return vert ? { dx: 0, dy: 0, sx: 1 + s * .6, sy: 1 - s } : { dx: 0, dy: 0, sx: 1 - s, sy: 1 + s * .6 };
}
function withT(tr, px, py, fn) {
  if (!tr) return;
  ctx.save(); ctx.translate(tr.dx + px, tr.dy + py); ctx.scale(tr.sx, tr.sy); ctx.translate(-px, -py); fn(); ctx.restore();
}

// ---------------- assembly timeline (chapter 2) ----------------
const ASM = {
  shell: [2.5, 3.05], bowl: [3.3, 3.75], dome: [4.0, 4.45], nzT: [4.8, 5.15], nzB: [5.1, 5.45],
  ports: [5.7, 5.85, 6.0], legL: [6.2, 6.62], legR: [6.35, 6.78],
};
const IMPACTS = [
  { t: 3.05, pts: [[cx - R, 330], [cx + R, 330], [cx - R, 520], [cx + R, 520]], txt: '착!', at: [cx + R + 58, 300], big: true },
  { t: 3.75, pts: [[cx - R, yBot], [cx + R, yBot]], txt: '착!', at: [cx + R + 50, yBot + 30], big: true },
  { t: 4.45, pts: [[cx - R, yTop], [cx + R, yTop]], txt: '착!', at: [cx + R + 50, yTop - 30], big: true },
  { t: 5.15, pts: [[cx - RN - 3, 152], [cx + RN + 3, 152]] },
  { t: 5.45, pts: [[cx - RN - 3, 686], [cx + RN + 3, 686]] },
  { t: 6.62, pts: [[cx - R - 20, 580]], txt: '딱', at: [cx - R - 60, 540] },
  { t: 6.78, pts: [[cx + R + 20, 580]], txt: '딱', at: [cx + R + 60, 540] },
  { t: 8.6, pts: [[cx - RF, 100], [cx + RF, 100]] },
  { t: 12.5, pts: [[cx - RF, 100], [cx + RF, 100]] },
  { t: 40.1, pts: [[cx - RF, 100], [cx + RF, 100]] },
  { t: 40.4, pts: [[cx - RF, 742], [cx + RF, 742]] },
];
function drawImpacts(t) {
  for (const im of IMPACTS) {
    const tau = t - im.t; if (tau < 0 || tau > .8) continue;
    if (tau < .35) {
      const a = 1 - tau / .35;
      ctx.strokeStyle = `rgba(39,49,61,${a})`; ctx.lineWidth = 2.4; ctx.lineCap = 'round';
      for (const [x, y] of im.pts) {
        const base = x < cx ? Math.PI : 0;
        for (let j = -2; j <= 2; j++) {
          const an = base + j * .42, r1 = 8 + 40 * eo(tau / .35), r2 = r1 + 14 * a;
          ctx.beginPath(); ctx.moveTo(x + Math.cos(an) * r1, y + Math.sin(an) * r1); ctx.lineTo(x + Math.cos(an) * r2, y + Math.sin(an) * r2); ctx.stroke();
        }
      }
      ctx.lineCap = 'butt';
    }
    if (im.txt) {
      const s = eob(pr(tau, 0, .2)), a = 1 - pr(tau, .5, .8);
      ctx.save(); ctx.translate(im.at[0], im.at[1]); ctx.rotate(-.12); ctx.scale(s, s); ctx.globalAlpha = a;
      ctx.font = `900 ${im.big ? 30 : 22}px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.lineJoin = 'round'; ctx.lineWidth = 6; ctx.strokeStyle = '#fff'; ctx.strokeText(im.txt, 0, 0);
      ctx.lineWidth = 2.5; ctx.strokeStyle = INK; ctx.strokeText(im.txt, 0, 0);
      ctx.fillStyle = '#f59e0b'; ctx.fillText(im.txt, 0, 0);
      ctx.restore();
    }
  }
}
function shake(t) {
  let y = 0;
  for (const im of IMPACTS) if (im.big) { const tau = t - im.t; if (tau > 0 && tau < .45) y += 5 * Math.exp(-12 * tau) * Math.sin(55 * tau); }
  return y;
}

// ---------------- vessel parts (flat) ----------------
function silhouette() {
  ctx.beginPath(); ctx.moveTo(cx - R, yBot); ctx.lineTo(cx - R, yTop);
  ctx.ellipse(cx, yTop, R, HD, 0, Math.PI, 2 * Math.PI); ctx.lineTo(cx + R, yBot);
  ctx.ellipse(cx, yBot, R, HD, 0, 0, Math.PI); ctx.closePath();
}
function shellFront() {
  ctx.beginPath(); ctx.moveTo(cx - R, yTop); ctx.lineTo(cx - R, yBot);
  ctx.ellipse(cx, yBot, R, RY, 0, Math.PI, 0, true); ctx.lineTo(cx + R, yTop);
  ctx.ellipse(cx, yTop, R, RY, 0, 0, Math.PI, false); ctx.closePath();
}
function bowlPath() { ctx.beginPath(); ctx.moveTo(cx - R, yBot); ctx.ellipse(cx, yBot, R, HD, 0, Math.PI, 0, true); ctx.ellipse(cx, yBot, R, RY, 0, 0, Math.PI, false); ctx.closePath(); }
function domePath() { ctx.beginPath(); ctx.moveTo(cx - R, yTop); ctx.ellipse(cx, yTop, R, HD, 0, Math.PI, 2 * Math.PI, false); ctx.ellipse(cx, yTop, R, RY, 0, 0, Math.PI, false); ctx.closePath(); }
function drawShell() {
  metalFill(shellFront, cx, R);
  ctx.beginPath(); ctx.ellipse(cx, yTop, R, RY, 0, 0, Math.PI * 2);
  ctx.fillStyle = M_IN; ctx.fill(); ctx.strokeStyle = INK; ctx.lineWidth = 2; ctx.stroke();
}
function drawBowl() {
  ctx.beginPath(); ctx.ellipse(cx, yBot, R, RY, 0, 0, Math.PI * 2); ctx.fillStyle = M_IN; ctx.fill(); ctx.strokeStyle = INK; ctx.lineWidth = 2; ctx.stroke();
  metalFill(bowlPath, cx, R);
}
function drawDome() {
  metalFill(domePath, cx, R);
  ctx.beginPath(); ctx.ellipse(cx, yTop, R * .8, HD * .74, 0, Math.PI * 1.1, Math.PI * 1.4);
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 4; ctx.lineCap = 'round'; ctx.stroke(); ctx.lineCap = 'butt';
}
function topNozzle() { metalFill(cylPath(cx, 112, 154, RN), cx, RN); metalFill(cylPath(cx, 104, 114, RF), cx, RF); face(cx, 104, RF, RN - 3, true, false); }
function bottomNozzle() { metalFill(cylPath(cx, 728, 738, RF), cx, RF); face(cx, 728, RF, 0, true, false); metalFill(cylPath(cx, 684, 728, RN), cx, RN); }
function drawNameplate(t) {
  const u = pr(t, 8.9, 9.2), sc = eob(u);
  if (u <= 0) return;
  ctx.save(); ctx.translate(cx - 62, 455); ctx.scale(sc, sc);
  rr(-32, -17, 64, 34, 4); ctx.fillStyle = '#fff7e0'; ctx.fill(); ctx.strokeStyle = INK; ctx.lineWidth = 1.6; ctx.stroke();
  ctx.fillStyle = INK; for (const [x, y] of [[-27, -12], [27, -12], [-27, 12], [27, 12]]) { ctx.beginPath(); ctx.arc(x, y, 1.5, 0, 7); ctx.fill(); }
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = `700 6.5px ${FONT}`; ctx.fillText('PSA ADSORBER', 0, -6);
  ctx.font = `800 11px ${FONT}`; ctx.fillText('BED A', 0, 6);
  ctx.restore();
}
function star(x, y, r) {
  ctx.beginPath();
  for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4, rr_ = i % 2 ? r * .3 : r; ctx[i ? 'lineTo' : 'moveTo'](x + Math.cos(a - Math.PI / 2) * rr_, y + Math.sin(a - Math.PI / 2) * rr_); }
  ctx.closePath(); ctx.fillStyle = '#fff'; ctx.fill(); ctx.strokeStyle = INK; ctx.lineWidth = 1.4; ctx.stroke();
}
function drawTwinkles(t) {
  const S = [[cx - 70, 190, 7.1], [cx - 58, 330, 7.3], [cx + 30, 600, 7.45], [cx - 50, 660, 7.6]];
  for (const [x, y, t0] of S) { const u = pr(t, t0, t0 + .6); if (u > 0 && u < 1) star(x, y, 11 * Math.sin(Math.PI * u)); }
}
// Outer skin: the vessel as seen before it is cut open.
function drawSkin(t) {
  withT(snapT(t, ...ASM.bowl, 0, 420, .16), cx, yBot, drawBowl);
  withT(snapT(t, ...ASM.shell, 0, -620, .06), cx, (yTop + yBot) / 2, drawShell);
  withT(snapT(t, ...ASM.dome, 0, -420, .16), cx, yTop, drawDome);
  drawNameplate(t);
  drawTwinkles(t);
}
function drawNozzles(t) {
  withT(snapT(t, ...ASM.nzT, 0, -320, .18), cx, 154, topNozzle);
  withT(snapT(t, ...ASM.nzB, 0, 300, .18), cx, 684, bottomNozzle);
}
const PORTS = [520, 420, 320];
function drawPorts(t) {
  PORTS.forEach((y, i) => {
    if (t < ASM.ports[i]) return;
    const s = eob(pr(t, ASM.ports[i], ASM.ports[i] + .35)); if (s <= 0) return;
    ctx.save(); ctx.translate(cx - R, y); ctx.scale(s, s);
    rr(-17, -4, 18, 8, 1); ctx.fillStyle = M_BODY; ctx.fill(); ctx.strokeStyle = INK; ctx.lineWidth = 1.4; ctx.stroke();
    rr(-13, -6.5, 6, 13, 1); ctx.fillStyle = M_SHADE; ctx.fill(); ctx.stroke();
    ctx.restore();
    if (s > .9) { ctx.fillStyle = '#5d6876'; ctx.font = `700 10px ${FONT}`; ctx.textAlign = 'right'; ctx.textBaseline = 'middle'; ctx.fillText('TE', cx - R - 22, y); }
  });
}
function legShape(x) {
  metalFill(() => { ctx.beginPath(); ctx.rect(x - 7, 598, 14, FLOOR - 5 - 598); }, x, 7, 1.6);
  metalFill(() => rr(x - 10, 556, 20, 48, 3), x, 10, 1.6);
  ctx.beginPath(); ctx.rect(x - 18, FLOOR - 6, 36, 6); ctx.fillStyle = M_SHADE; ctx.fill(); ctx.strokeStyle = INK; ctx.lineWidth = 1.6; ctx.stroke();
}
function drawLegs(t) {
  withT(snapT(t, ...ASM.legL, -300, 0, .14), cx - R - 9, 580, () => legShape(cx - R - 9));
  withT(snapT(t, ...ASM.legR, 300, 0, .14), cx + R + 9, 580, () => legShape(cx + R + 9));
}
function drawBlindFlange(t) {
  if (t < 8.3 || t > 12.2) return;
  const rem = eio(pr(t, 11.7, 12.2));
  ctx.save(); ctx.globalAlpha = 1 - pr(t, 11.95, 12.2); ctx.translate(160 * rem, -60 * rem);
  withT(snapT(t, 8.3, 8.6, 0, -220, .2), cx, 104, () => { metalFill(cylPath(cx, 96, 104, RF), cx, RF); face(cx, 96, RF, 0, true, true); if (t >= 9.0) drawGauge(t); });
  ctx.restore();
}
function drawGauge(t) {
  const s = eob(pr(t, 9.0, 9.3)), x = cx, y = 62;
  ctx.save(); ctx.translate(x, 96); ctx.scale(s, s); ctx.translate(-x, -96);
  ctx.beginPath(); ctx.rect(x - 3, 78, 6, 18); ctx.fillStyle = M_BODY; ctx.fill(); ctx.strokeStyle = INK; ctx.lineWidth = 1.4; ctx.stroke();
  ctx.beginPath(); ctx.arc(x, y, 18, 0, 7); ctx.fillStyle = '#fff'; ctx.fill(); ctx.lineWidth = 3; ctx.stroke();
  ctx.lineWidth = 1;
  for (let j = 0; j <= 10; j++) {
    const an = (-225 + 27 * j) * Math.PI / 180;
    ctx.beginPath(); ctx.moveTo(x + Math.cos(an) * 11, y + Math.sin(an) * 11); ctx.lineTo(x + Math.cos(an) * 14, y + Math.sin(an) * 14); ctx.stroke();
  }

    if (ring > 0) { ctx.beginPath(); ctx.arc(pos[0], pos[1], 3 + 9 * ring, 0, 7); ctx.strokeStyle = m.sp.col; ctx.globalAlpha = a * (1 - ring); ctx.lineWidth = 1.6; ctx.stroke(); ctx.globalAlpha = a; }
    ctx.beginPath(); ctx.arc(pos[0], pos[1], m.sp.k === 'H2' ? 2.8 : 3.6, 0, 7); ctx.fillStyle = m.sp.col; ctx.fill();
    ctx.lineWidth = 1.3; ctx.strokeStyle = '#fff'; ctx.stroke();
  }
  ctx.globalAlpha = 1;
}
function drawFlow(t) {
  const a = pr(t, 41.2, 41.8); if (a <= 0) return;
  ctx.save(); ctx.globalAlpha = a; ctx.lineWidth = 3; ctx.setLineDash([9, 13]); ctx.lineDashOffset = -t * 60;
  ctx.strokeStyle = '#475569'; ctx.beginPath(); ctx.moveTo(40, 772); ctx.lineTo(cx, 772); ctx.lineTo(cx, 740); ctx.stroke();
  ctx.strokeStyle = '#0891b2'; ctx.beginPath(); ctx.moveTo(cx, 100); ctx.lineTo(cx, 60); ctx.lineTo(40, 60); ctx.stroke();
  ctx.setLineDash([]);
  const arrow = (x, y, dir, col) => { ctx.beginPath(); ctx.moveTo(x + 13 * dir, y); ctx.lineTo(x, y - 9); ctx.lineTo(x, y + 9); ctx.closePath(); ctx.fillStyle = col; ctx.fill(); ctx.strokeStyle = INK; ctx.lineWidth = 1.4; ctx.stroke(); };
  arrow(18, 772, 1, '#94a3b8'); arrow(34, 60, -1, '#22d3ee');
  ctx.font = `800 13px ${FONT}`; ctx.textAlign = 'left'; ctx.textBaseline = 'bottom';
  ctx.fillStyle = '#334155'; ctx.fillText('원료 가스 (Feed)', 22, 754);
  ctx.fillStyle = '#0e7490'; ctx.fillText('H₂ 제품 (Product)', 22, 42);
  ctx.restore();
}

// ---------------- annotations ----------------
function label(x, y, title, sub, align, a, sp) {
  ctx.save(); ctx.globalAlpha = a; ctx.textAlign = align; ctx.textBaseline = 'middle';
  let tx = x;
  if (sp) { const d = Math.max(12, sp.d * 1.3); ctx.drawImage(sp.c, x, y - 8 - d / 2, d, d); tx = x + d + 6; }
  ctx.lineJoin = 'round'; ctx.font = `800 14.5px ${FONT}`; ctx.strokeStyle = 'rgba(248,250,252,.95)'; ctx.lineWidth = 4;
  ctx.strokeText(title, tx, y - 8); ctx.fillStyle = '#18212c'; ctx.fillText(title, tx, y - 8);
  if (sub) { ctx.font = `500 12.5px ${FONT}`; ctx.strokeText(sub, tx, y + 9); ctx.fillStyle = '#566170'; ctx.fillText(sub, tx, y + 9); }
  ctx.restore();
}
function leader(x0, y0, x1, y1, a) {
  ctx.save(); ctx.globalAlpha = a; ctx.strokeStyle = INK; ctx.lineWidth = 1.3;
  ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
  ctx.beginPath(); ctx.arc(x0, y0, 3, 0, 7); ctx.fillStyle = '#fff'; ctx.fill(); ctx.stroke();
  ctx.restore();
}
function drawCallouts(t) {
  for (const L of LAYERS) {
    const a = pr(t, L.tDone - .1, L.tDone + .4); if (a <= 0) continue;
    const ym = (L.yLo + L.yHi) / 2, xr = cx + R + 30 + 20 * (1 - eo(a));
    leader(cx + RI - 16, ym, xr, ym, a);
    label(xr + 6, ym + 8, L.name, L.role, 'left', a, L.sp);
  }
  for (const S of SCREENS) {
    const a = pr(t, S.t1, S.t1 + .5); if (a <= 0) continue;
    leader(cx - RI + 16, S.y, cx - R - 34, S.y, a);
    label(cx - R - 40, S.y + 8, '메시 스크린', null, 'right', a);
  }
}
function drawLegend(t) {
  const a = pr(t, 42.2, 42.8); if (a <= 0) return;
  const x = 820, y = 560, w = 250, h = 34 + SPECIES.length * 24;
  ctx.save(); ctx.globalAlpha = a;
  rr(x, y, w, h, 10); ctx.fillStyle = '#fff'; ctx.fill(); ctx.strokeStyle = INK; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.fillStyle = '#5d6876'; ctx.font = `700 11px ${FONT}`; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillText('성분 → 흡착되는 층', x + 14, y + 18);
  SPECIES.forEach((s, i) => {
    const yy = y + 42 + i * 24;
    ctx.beginPath(); ctx.arc(x + 20, yy, s.k === 'H2' ? 4 : 5, 0, 7); ctx.fillStyle = s.col; ctx.fill();
    ctx.fillStyle = '#18212c'; ctx.font = `800 13px ${FONT}`; ctx.fillText(s.label, x + 34, yy);
    ctx.fillStyle = '#566170'; ctx.font = `500 12.5px ${FONT}`; ctx.fillText(s.to, x + 84, yy);
  });
  ctx.restore();
}
function drawBlueprint(t) {
  const prog = eio(pr(t, .2, 2.0));
  const ghostA = (t < 2.5 ? .9 : lerp(.9, .5, pr(t, 2.5, 3.0))) * (1 - pr(t, 7.0, 7.6));
  if (ghostA > 0) {
    ctx.save(); ctx.globalAlpha = ghostA;
    ctx.beginPath(); ctx.rect(-500, -500, 2600, 590 + prog * 760); ctx.clip();
    ctx.setLineDash([7, 5]); ctx.strokeStyle = '#3b82f6'; ctx.lineWidth = 1.6;
    silhouette(); ctx.stroke();
    ctx.strokeRect(cx - RN, 112, 2 * RN, 42); ctx.strokeRect(cx - RF, 104, 2 * RF, 10);
    ctx.strokeRect(cx - RN, 684, 2 * RN, 44); ctx.strokeRect(cx - RF, 728, 2 * RF, 10);
    for (const x of [cx - R - 9, cx + R + 9]) { ctx.strokeRect(x - 10, 556, 20, 48); ctx.strokeRect(x - 7, 604, 14, FLOOR - 609); }
    ctx.beginPath(); ctx.moveTo(cx, 80); ctx.lineTo(cx, 760); ctx.setLineDash([16, 4, 3, 4]); ctx.lineWidth = .9; ctx.stroke();
    ctx.restore();
  }
  const dimA = pr(t, .9, 1.6) * (1 - pr(t, 2.4, 2.9));
  if (dimA <= 0) return;
  ctx.save(); ctx.globalAlpha = dimA; ctx.strokeStyle = '#1d4ed8'; ctx.fillStyle = '#1d4ed8'; ctx.lineWidth = 1.2;
  const head = (x, y, ang) => { ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - 9 * Math.cos(ang - .38), y - 9 * Math.sin(ang - .38)); ctx.lineTo(x - 9 * Math.cos(ang + .38), y - 9 * Math.sin(ang + .38)); ctx.closePath(); ctx.fill(); };
  const xd = cx - R - 48;
  ctx.beginPath(); ctx.moveTo(cx - R - 6, yTop); ctx.lineTo(xd - 8, yTop); ctx.moveTo(cx - R - 6, yBot); ctx.lineTo(xd - 8, yBot);
  ctx.moveTo(xd, yTop); ctx.lineTo(xd, yBot); ctx.stroke();
  head(xd, yTop, -Math.PI / 2); head(xd, yBot, Math.PI / 2);
  ctx.beginPath(); ctx.moveTo(cx - R, 420); ctx.lineTo(cx + R, 420); ctx.stroke();
  head(cx - R, 420, Math.PI); head(cx + R, 420, 0);
  ctx.font = `800 15px ${FONT}`; ctx.textBaseline = 'middle';
  ctx.textAlign = 'right'; ctx.fillText('L', xd - 10, (yTop + yBot) / 2 - 9);
  ctx.font = `500 12px ${FONT}`; ctx.fillText('직관부', xd - 10, (yTop + yBot) / 2 + 9);
  ctx.textAlign = 'center'; ctx.font = `800 15px ${FONT}`; ctx.fillText('Ø D', cx, 406);
  const hx = cx + R * .72, hy = yTop - HD * .69;
  ctx.beginPath(); ctx.moveTo(hx, hy); ctx.lineTo(cx + R + 40, 150); ctx.lineTo(cx + R + 52, 150); ctx.stroke();
  ctx.textAlign = 'left'; ctx.font = `600 13px ${FONT}`; ctx.fillText('2:1 반타원형 경판', cx + R + 58, 150);
  ctx.fillText('(깊이 = D/4)', cx + R + 58, 168);
  ctx.strokeRect(820, 724, 250, 62); ctx.beginPath(); ctx.moveTo(820, 752); ctx.lineTo(1070, 752); ctx.stroke();
  ctx.font = `700 13px ${FONT}`; ctx.fillText('PSA ADSORBER · BED A', 832, 738);
  ctx.font = `500 12px ${FONT}`; ctx.fillText('조립도 · 축척 없음', 832, 769);
  ctx.restore();
}
function drawCutLine(t) {
  const u = pr(t, 10.4, 11.6); if (u <= 0 || u >= 1) return;
  const x = lerp(cx - R - 30, cx + R + 30, eio(u));
  ctx.save();
  ctx.strokeStyle = 'rgba(239,68,68,.18)'; ctx.lineWidth = 12; ctx.beginPath(); ctx.moveTo(x, 90); ctx.lineTo(x, 750); ctx.stroke();
  ctx.strokeStyle = '#ef4444'; ctx.lineWidth = 2; ctx.setLineDash([10, 5]); ctx.stroke(); ctx.setLineDash([]);
  ctx.fillStyle = '#dc2626'; ctx.font = `800 12px ${FONT}`; ctx.textAlign = 'center'; ctx.fillText('단면 A–A', x, 80);
  ctx.restore();
}

// ---------------- camera ----------------
const CAM = [[0, 550, 430, 1], [11.6, 550, 430, 1], [12.5, 550, 330, .88], [38.9, 550, 330, .88], [39.8, 550, 430, 1]];
function camera(t) {
  for (let i = 0; i < CAM.length - 1; i++) {
    const a = CAM[i], b = CAM[i + 1];
    if (t < b[0]) { const u = eio(clamp((t - a[0]) / (b[0] - a[0]))); return [lerp(a[1], b[1], u), lerp(a[2], b[2], u), lerp(a[3], b[3], u)]; }
  }
  return CAM[CAM.length - 1].slice(1);
}

// ---------------- frame ----------------
function render(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#f8fafc'; ctx.fillRect(0, 0, cv.width, cv.height);
  const [fx, fy0, z] = camera(t), fy = fy0 - shake(t), k = DPR * VIEW.s * z;
  ctx.setTransform(k, 0, 0, k, DPR * (VIEW.ox + VIEW.s * (W / 2 - fx * z)), DPR * (VIEW.oy + VIEW.s * (H / 2 - fy * z)));

  ctx.beginPath();
  for (let x = -600; x <= W + 600; x += 40) { ctx.moveTo(x, -700); ctx.lineTo(x, H + 500); }
  for (let y = -700; y <= H + 500; y += 40) { ctx.moveTo(-600, y); ctx.lineTo(W + 600, y); }
  ctx.strokeStyle = 'rgba(59,130,246,.07)'; ctx.lineWidth = 1; ctx.stroke();
  ctx.fillStyle = '#e7ecf2'; ctx.fillRect(-600, FLOOR, W + 1200, 500);
  ctx.beginPath(); ctx.moveTo(-600, FLOOR); ctx.lineTo(W + 600, FLOOR); ctx.strokeStyle = INK; ctx.lineWidth = 2; ctx.stroke();

  drawBlueprint(t);
  const shA = pr(t, ASM.legR[1], ASM.legR[1] + .3);
  if (shA > 0) { ctx.save(); ctx.globalAlpha = .13 * shA; ctx.beginPath(); ctx.ellipse(cx, FLOOR + 3, R + 46, 11, 0, 0, 7); ctx.fillStyle = '#0f172a'; ctx.fill(); ctx.restore(); }
  drawBotSpool(t);

  const cutU = pr(t, 10.4, 11.6);
  if (t < 10.4) { drawSkin(t); drawNozzles(t); }
  else {
    const sx = lerp(cx - R - 30, cx + R + 30, eio(cutU));
    cavity(); drawContents(t);
    if (cutU < 1) { ctx.save(); ctx.beginPath(); ctx.rect(sx, -800, 3000, 3000); ctx.clip(); drawSkin(t); drawNozzles(t); ctx.restore(); }
    ctx.save(); ctx.beginPath(); ctx.rect(-600, -800, sx + 600, 3000); ctx.clip(); drawSection(); ctx.restore();
  }
  drawPorts(t);
  drawLegs(t);
  drawBlindFlange(t);
  drawHopperBack(t);
  drawHopperBeads(t);
  drawHopperFront(t);
  for (const L of LAYERS) drawBag(L, t);
  drawTopSpool(t);
  drawCutLine(t);
  drawFlow(t);
  drawImpacts(t);
  drawCallouts(t);
  drawLegend(t);
}

// ---------------- chapters & UI ----------------
const CH = [
  { t: 0, g: '제작', title: '설계 도면', desc: '내경 D, 직관부 길이 L, 2:1 반타원형 경판으로 흡착탑의 기본 형상을 정합니다.' },
  { t: 2.5, g: '제작', title: '착착 조립', desc: '쉘 → 하부 경판 → 상부 경판 → 노즐 → 온도 포트(TE) → 지지 다리 순서로 부품이 도면 자리에 끼워집니다.' },
  { t: 8.3, g: '제작', title: '마감 · 수압시험', desc: '블라인드 플랜지로 막고 명판을 붙인 뒤, 수압시험으로 누설이 없는지 확인합니다.' },
  { t: 10.4, g: '충전', title: '단면 보기', desc: '내부를 보기 위해 앞쪽 절반을 잘라낸 단면으로 전환합니다.' },
  { t: 11.7, g: '충전', title: '충전 준비', desc: '블라인드 플랜지를 열고 노즐 위에 충전 호퍼를 올립니다.' },
  { t: 13.2, g: '충전', title: '하부 지지층', desc: '톤백에서 세라믹 볼이 호퍼로 쏟아지고, 호퍼 아래로 빠져나가 하부 경판에 쌓입니다.' },
  { t: 17.4, g: '충전', title: '활성 알루미나', desc: '메시 스크린을 깔고, 수분을 먼저 잡는 활성 알루미나를 붓습니다.' },
  { t: 22.4, g: '충전', title: '활성탄', desc: 'CO₂·CH₄를 잡는 활성탄을 붓습니다. 가운데에 먼저 쌓인 뒤 가장자리로 굴러 퍼집니다.' },
  { t: 28.6, g: '충전', title: '제올라이트 5A', desc: 'CO·N₂를 잡는 제올라이트 5A를 맨 위 흡착층으로 붓습니다.' },
  { t: 34.6, g: '충전', title: '상부 고정층', desc: '스크린과 세라믹 볼로 윗면을 눌러, 흐름에 흡착제가 들뜨거나 섞이지 않게 합니다.' },
  { t: 39.0, g: '운전', title: '배관 연결', desc: '호퍼를 치우고 하부에 원료 배관, 상부에 제품 배관을 연결합니다.' },
  { t: 41.2, g: '운전', title: '가스 흐름', desc: '원료 가스가 아래에서 위로 지나며 각 성분이 맞는 층에 흡착되고, H₂만 위로 빠져나갑니다.' },
];
const $ = id => document.getElementById(id);
const aside = $('chapters'), items = [];
let lastG = '';
CH.forEach((c, i) => {
  if (c.g !== lastG) {
    const h = document.createElement('h2'); h.textContent = c.g; aside.appendChild(h);
    aside.appendChild(document.createElement('ol')); lastG = c.g;
  }
  const li = document.createElement('li');
  li.innerHTML = `<span class="n">${i + 1}</span><span>${c.title}</span><span class="tm">${c.t.toFixed(1)}s</span>`;
  li.onclick = () => { T = c.t + 0.001; };
  aside.lastChild.appendChild(li); items.push(li);
  const tk = document.createElement('span'); tk.style.left = (c.t / T_END * 100) + '%'; $('ticks').appendChild(tk);
});

let T = 0, playing = true, speed = 1, last = performance.now(), curCh = -1;
const scrub = $('scrub');
function chapterAt(t) { let i = 0; while (i < CH.length - 1 && t >= CH[i + 1].t) i++; return i; }
function updateUI() {
  const i = chapterAt(T);
  if (i !== curCh) {
    curCh = i;
    $('capStep').textContent = `STEP ${String(i + 1).padStart(2, '0')} · ${CH[i].g}`;
    $('capTitle').textContent = CH[i].title; $('capDesc').textContent = CH[i].desc;
    items.forEach((li, j) => { li.classList.toggle('on', j === i); li.classList.toggle('done', j < i); });
    items[i].scrollIntoView({ block: 'nearest' });
  }
  const end = i < CH.length - 1 ? CH[i + 1].t : T_END;
  $('capBar').style.width = (pr(T, CH[i].t, end) * 100) + '%';
  scrub.value = T;
  $('time').textContent = `${T.toFixed(1)} / ${T_END.toFixed(1)} s`;
  $('btnPlay').textContent = playing ? '일시정지' : (T >= T_END ? '다시 재생' : '재생');
}
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (playing) {
    T += dt * speed;
    if (T >= T_END) { if ($('loop').checked) T = 0; else { T = T_END; playing = false; } }
  }
  render(T); updateUI();
  requestAnimationFrame(frame);
}
$('btnPlay').onclick = () => { if (T >= T_END) T = 0; playing = !playing; };
$('btnRestart').onclick = () => { T = 0; playing = true; };
scrub.oninput = () => { T = +scrub.value; };
$('speed').onchange = e => { speed = +e.target.value; };
window.addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT') return;
  if (e.code === 'Space') { e.preventDefault(); $('btnPlay').click(); }
  if (e.code === 'ArrowRight') T = Math.min(T_END, T + 3);
  if (e.code === 'ArrowLeft') T = Math.max(0, T - 3);
});
const q = new URLSearchParams(location.search);
if (q.has('t')) { T = clamp(+q.get('t'), 0, T_END); playing = !q.has('pause'); }
requestAnimationFrame(frame);
</script>
